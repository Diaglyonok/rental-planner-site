<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%% | Rental Planner</title>
<meta name="description" content="%%DESC%%">

<meta property="og:title" content="%%TITLE%% | Rental Planner">

<meta property="og:url" content="%%URL%%">
<meta property="og:image" content="%%OG%%">
%%FONTS%%
<style>
:root{
  color-scheme: light;
  --ink:#141A3A;
  --ink2:#4A5174;
  --ink3:#8990AC;
  --ground:#F7F8FC;
  --line:#E7EAF3;
  --line2:#DAE0EE;
  --blue:#5B86E5;
  --blue-d:#4772D6;
  --display:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Golos Text',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--ground);background-image:radial-gradient(900px 420px at 85% -120px,rgba(54,209,220,.10),transparent 70%),radial-gradient(800px 380px at 0 -80px,rgba(91,134,229,.10),transparent 70%);background-repeat:no-repeat;color:var(--ink2);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--blue-d);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:8px}
.wrap{max-width:860px;margin-inline:auto;padding-inline:16px}
.nav{padding-top:14px}
.nav-bar{display:flex;align-items:center;height:64px;padding:0 16px;background:rgba(255,255,255,.86);border:1px solid rgba(218,224,238,.9);border-radius:20px;box-shadow:0 1px 2px rgba(20,26,58,.03),0 10px 30px -14px rgba(38,58,120,.18)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;color:var(--ink);letter-spacing:-.015em;font-size:17px}
.brand:hover{text-decoration:none}
.brand img{width:40px;height:40px;border-radius:11px}
main{padding-block:28px 56px}
.doc{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px 20px;box-shadow:0 1px 2px rgba(20,26,58,.04),0 14px 34px -10px rgba(38,58,120,.12),0 40px 80px -36px rgba(38,58,120,.16);overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--display);color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(32px,7vw,48px);line-height:1.08;font-weight:600;letter-spacing:-.03em}
h2{font-size:22px;line-height:1.25;font-weight:600;margin-top:36px}
h3{font-size:18px;line-height:1.3;font-weight:600;margin-top:22px}
.updated{margin:10px 0 24px;color:var(--ink3);font-size:15px}
p,ul,ol{margin:12px 0 0}
ul,ol{padding-inline-start:22px}
li+li{margin-top:8px}
li::marker{color:var(--blue)}
footer{border-top:1px solid var(--line);padding-block:22px 32px;color:var(--ink3);font-size:14px}
@media (min-width:720px){
  .wrap{padding-inline:32px}
  .nav-bar{height:72px;padding:0 20px;border-radius:22px}
  .brand img{width:44px;height:44px;border-radius:12px}
  main{padding-block:44px 80px}
  .doc{padding:48px 56px}
  h2{font-size:24px;margin-top:44px}
}
</style>
</head>
<body>
<header class="nav wrap">
  <div class="nav-bar">
    <a class="brand" href="/"><img src="/logo.png" alt="">Rental Planner</a>
  </div>
</header>
<main class="wrap">
  <article class="doc">
%%CONTENT%%
  </article>
</main>
<footer class="wrap">© 2026 DGL Factor</footer>
%%ANALYTICS%%
</body>
</html>
